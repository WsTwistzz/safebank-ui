name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Pages 部署在 /safebank-ui/ 子路径，用 --base 覆盖，避免改配置引入 Node 类型依赖
      - name: Build
        run: pnpm exec vite build --base=/safebank-ui/

      # 前端使用 createBrowserRouter（history 模式），
      # Pages 无 SPA 回退，深链接刷新会 404 —— 用 404.html 兜底。
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      # 关闭 Jekyll，避免 _ 开头的资源被忽略
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4